[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "geet-geet"
version = "1.4.0"
requires-python = ">=3.8"
readme = "README.md"

[project.scripts]
geet = "geet:main"
geet-geet = "geet:main"

[tool.hatch.build.targets.wheel]
include = [
    "geet.py",
    "bin/**",
    "lib/**",
    "layer/**",
    "docs/**",
    "README.md",
]

[tool.hatch.build.targets.sdist]
include = [
    "geet.py",
    "bin/**",
    "lib/**",
    "layer/**",
    "docs/**",
    "README.md",
]
